        function generateUniqueSheetName(baseName, usedNames) {
            // Sanitize the base name
            let sanitized = baseName.replace(/[:\\/?*\[\]]/g, '_');
            
            // Truncate to fit counter if needed
            let sheetName = sanitized.substring(0, 31);
            
            if (!usedNames.has(sheetName)) {
                usedNames.add(sheetName);
                return sheetName;
            }
            
            // If duplicate, add counter
            let counter = 2;
            let uniqueName;
            
            while (true) {
                const suffix = `_${counter}`;
                const maxLength = 31 - suffix.length;
                uniqueName = sanitized.substring(0, maxLength) + suffix;
                
                if (!usedNames.has(uniqueName)) {
                    usedNames.add(uniqueName);
                    return uniqueName;
                }
                counter++;
            }
        }

        // Extract first 4 columns from data
        function extractFirst4Columns(data) {
            if (!data || data.length === 0) return data;
            
            const headers = Object.keys(data[0]);
            const first4Headers = headers.slice(0, 4);
            
            return data.map(row => {
                const filteredRow = {};
                first4Headers.forEach(header => {
                    filteredRow[header] = row[header];
                });
                return filteredRow;
            });
        }

        async function handleFile(file) {
            if (!file.name.endsWith('.zip')) {
                showStatus('⚠️ Please upload a ZIP file', 'error');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {

            fileInfo.classList.add('show');
            downloadBtn.classList.remove('show');

                // Filter out system files and get CSV and Excel files
                const csvFiles = Object.keys(zip.files).filter(name => 
                    name.endsWith('.csv') && !name.startsWith('__MACOSX') && !name.includes('/.') && !name.startsWith('.')
                );
                
                const excelFiles = Object.keys(zip.files).filter(name => 
                    (name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.xlsm')) && 
                    !name.startsWith('__MACOSX') && !name.includes('/.') && !name.startsWith('.')
                );

                const totalFiles = csvFiles.length + excelFiles.length;

                if (totalFiles === 0) {
                    showStatus('❌ No CSV or Excel files found in ZIP', 'error');
                    progressBar.classList.remove('show');
                    return;
                }

                fileCount.textContent = `✓ Found ${csvFiles.length} CSV and ${excelFiles.length} Excel file(s)`;
                updateProgress(20);

                workbook = XLSX.utils.book_new();
                const usedSheetNames = new Set();
                let totalSheets = 0;
                let processed = 0;

                // Process CSV files
                for (const csvFile of csvFiles) {
                    const content = await zip.files[csvFile].async('string');
                    const parsed = Papa.parse(content, {
                        header: true,
                        skipEmptyLines: true,
                        dynamicTyping: true
                    });

                    if (parsed.data.length > 0) {
                        const filteredData = extractFirst4Columns(parsed.data);
                        
                        // Generate unique sheet name from file name
                        const baseName = csvFile.split('/').pop().replace('.csv', '');
                        const sheetName = generateUniqueSheetName(baseName, usedSheetNames);

                        const worksheet = XLSX.utils.json_to_sheet(filteredData);
                        XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
                        totalSheets++;
                    }

                    processed++;
                    updateProgress(20 + (processed / totalFiles) * 40);
                }

                // Process Excel files
                for (const excelFile of excelFiles) {
                    const content = await zip.files[excelFile].async('arraybuffer');
                    const excelWorkbook = XLSX.read(content, { type: 'array' });
                    
                    const baseFileName = excelFile.split('/').pop().replace(/\.(xlsx|xls|xlsm)$/, '');
                    
                    // Process each sheet in the Excel file

        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🚀</div>
            <div class="upload-text">Drop your ZIP file here</div>
            <div class="upload-hint">or click to browse • ZIP files only • Max 50MB</div>
            <input type="file" id="fileInput" accept=".zip">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
            <div class="csv-count" id="csvCount"></div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="status"></div>

        <button class="download-btn" id="downloadBtn">⬇️ Download Excel File</button>
        <button class="convert-more-btn" id="convertMoreBtn">🔄 Convert Another File</button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const csvCount = document.getElementById('csvCount');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const convertMoreBtn = document.getElementById('convertMoreBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let workbook = null;

        // Sparkle effect
        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 3000);
        }

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                createSparkle(e.clientX, e.clientY);
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file.name.endsWith('.zip')) {
                showStatus('⚠️ Please upload a ZIP file', 'error');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showStatus('⚠️ File size exceeds 50MB limit', 'error');
                return;
            }

            fileName.textContent = '📦 ' + file.name;
            fileSize.textContent = `Size: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
            fileInfo.classList.add('show');
            downloadBtn.classList.remove('show');
            convertMoreBtn.classList.remove('show');

            showStatus('⚡ Processing ZIP file...', 'processing');
            progressBar.classList.add('show');
            updateProgress(10);

            try {
                const zip = await JSZip.loadAsync(file);
                const csvFiles = Object.keys(zip.files).filter(name => 
                    name.endsWith('.csv') && !name.startsWith('__MACOSX')
                );

                if (csvFiles.length === 0) {
                    showStatus('❌ No CSV files found in ZIP', 'error');
                    progressBar.classList.remove('show');
                    return;
                }

                csvCount.textContent = `✓ Found ${csvFiles.length} CSV file${csvFiles.length > 1 ? 's' : ''}`;
                updateProgress(30);

                workbook = XLSX.utils.book_new();
                let processed = 0;
                const usedSheetNames = new Set();

                for (const csvFile of csvFiles) {
                    const content = await zip.files[csvFile].async('string');
                    const parsed = Papa.parse(content, {
                        header: true,
                        skipEmptyLines: true,
                        dynamicTyping: true
                    });

                    // Extract only first 4 columns
                    if (parsed.data.length > 0) {
                        const headers = Object.keys(parsed.data[0]);
                        const first4Headers = headers.slice(0, 4);
                        
                        // Filter each row to only include first 4 columns
                        const filteredData = parsed.data.map(row => {
                            const filteredRow = {};
                            first4Headers.forEach(header => {
                                filteredRow[header] = row[header];
                            });
                            return filteredRow;
                        });

                        let sheetName = csvFile.split('/').pop().replace('.csv', '');
                        sheetName = sheetName.replace(/[:\\/?*\[\]]/g, '_');
                        
                        // Handle duplicate sheet names
                        let finalSheetName = sheetName.substring(0, 31);
                        let counter = 1;
                        
                        while (usedSheetNames.has(finalSheetName)) {
                            const suffix = `_${counter}`;
                            const maxLength = 31 - suffix.length;
                            finalSheetName = sheetName.substring(0, maxLength) + suffix;
                            counter++;
                        }
                        
                        usedSheetNames.add(finalSheetName);

                        const worksheet = XLSX.utils.json_to_sheet(filteredData);
                        XLSX.utils.book_append_sheet(workbook, worksheet, finalSheetName);
                    }

                    processed++;
                    updateProgress(30 + (processed / csvFiles.length) * 60);
                }

                updateProgress(100);
                showStatus(`🎉 Successfully processed ${csvFiles.length} CSV file${csvFiles.length > 1 ? 's' : ''} (first 4 columns only)!`, 'success');
                downloadBtn.classList.add('show');
                convertMoreBtn.classList.add('show');

            } catch (error) {
                showStatus('❌ Error processing ZIP file: ' + error.message, 'error');
                progressBar.classList.remove('show');
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (workbook) {
                XLSX.writeFile(workbook, 'combined_output.xlsx');
                showStatus('✅ Excel file downloaded successfully!', 'success');
                
                // Create sparkles on download
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createSparkle(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight
                        );
                    }, i * 100);
                }
            }
        });

        convertMoreBtn.addEventListener('click', () => {
            // Reset everything
            fileInput.value = '';
            fileInfo.classList.remove('show');
            status.classList.remove('show');
            downloadBtn.classList.remove('show');
            convertMoreBtn.classList.remove('show');
            progressBar.classList.remove('show');
            progressFill.style.width = '0%';
            workbook = null;
            fileName.textContent = '';
            fileSize.textContent = '';
            csvCount.textContent = '';
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show ' + type;
        }

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
        }
    </script>
</body>
</html>
