<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV & Excel Merger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 121, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(52, 211, 153, 0.2) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 40px 32px;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 32px rgba(102, 126, 234, 0.6); }
        }

        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 400;
        }

        .upload-area {
            border: 2px dashed rgba(102, 126, 234, 0.5);
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(102, 126, 234, 0.05);
            position: relative;
            overflow: hidden;
        }

        .upload-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .upload-area:hover::before {
            left: 100%;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.2);
        }

        .upload-area.dragover {
            border-color: #ff79c6;
            background: rgba(255, 121, 198, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 0 4px rgba(255, 121, 198, 0.2);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .upload-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 16px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 12px;
            display: none;
            backdrop-filter: blur(10px);
        }

        .file-info.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-name {
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 15px;
        }

        .file-size {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .status {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: 500;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }

        .status.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .status.processing {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
        }

        .status.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #34d399;
        }

        .status.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #f87171;
        }

        .download-btn {
            display: none;
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        .download-btn.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .convert-more-btn {
            display: none;
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .convert-more-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        .convert-more-btn.show {
            display: block;
            animation: slideIn 0.4s ease-out 0.1s backwards;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.show {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #ff79c6 100%);
            background-size: 200% 100%;
            width: 0%;
            transition: width 0.3s ease;
            animation: shimmer 2s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .file-count {
            margin-top: 10px;
            color: #34d399;
            font-weight: 600;
            font-size: 14px;
        }

        .sheet-count {
            margin-top: 5px;
            color: #fbbf24;
            font-weight: 500;
            font-size: 13px;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            animation: sparkleFloat 3s ease-out forwards;
        }

        @keyframes sparkleFloat {
            0% { 
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% { 
                transform: translateY(-100px) scale(0);
                opacity: 0;
            }
        }

        .debug-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            display: none;
        }

        .debug-info.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">✨</div>
            <h1>CSV & Excel Fusion</h1>
            <p class="subtitle">Merge CSV and Excel files into one unified workbook</p>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🚀</div>
            <div class="upload-text">Drop your ZIP file here</div>
            <div class="upload-hint">CSV & Excel supported • ZIP files only • Max 50MB</div>
            <input type="file" id="fileInput" accept=".zip">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
            <div class="file-count" id="fileCount"></div>
            <div class="sheet-count" id="sheetCount"></div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="status"></div>
        <div class="debug-info" id="debugInfo"></div>

        <button class="download-btn" id="downloadBtn">⬇️ Download Merged Excel File</button>
        <button class="convert-more-btn" id="convertMoreBtn">🔄 Convert Another File</button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileCount = document.getElementById('fileCount');
        const sheetCount = document.getElementById('sheetCount');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const convertMoreBtn = document.getElementById('convertMoreBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const debugInfo = document.getElementById('debugInfo');

        let workbook = null;

        function debugLog(message) {
            console.log(message);
            debugInfo.textContent += message + '\n';
            debugInfo.classList.add('show');
        }

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            sparkle.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 3000);
        }

        uploadArea.addEventListener('click', () => {
            debugLog('Upload area clicked');
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
            debugLog('File dropped');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                debugLog('File detected: ' + files[0].name);
                createSparkle(e.clientX, e.clientY);
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            debugLog('File input changed');
            if (e.target.files.length > 0) {
                debugLog('File selected: ' + e.target.files[0].name);
                handleFile(e.target.files[0]);
            }
        });

        function generateUniqueSheetName(baseName, usedNames) {
            let sanitized = baseName.replace(/[:\\/?*\[\]]/g, '_');
            let sheetName = sanitized.substring(0, 31);

            if (!usedNames.has(sheetName)) {
                usedNames.add(sheetName);
                return sheetName;
            }

            let counter = 2;
            let uniqueName;

            while (true) {
                const suffix = `_${counter}`;
                const maxLength = 31 - suffix.length;
                uniqueName = sanitized.substring(0, maxLength) + suffix;

                if (!usedNames.has(uniqueName)) {
                    usedNames.add(uniqueName);
                    return uniqueName;
                }
                counter++;
            }
        }

        // Extract first 11 columns from data
        function extractFirst11Columns(data) {
            if (!data || data.length === 0) return data;

            const headers = Object.keys(data[0]);
            const first11Headers = headers.slice(0, 11);

            return data.map(row => {
                const filteredRow = {};
                first11Headers.forEach(header => {
                    filteredRow[header] = row[header];
                });
                return filteredRow;
            });
        }

        async function handleFile(file) {
            debugLog('Handling file: ' + file.name + ', type: ' + file.type + ', size: ' + file.size);

            debugInfo.textContent = '';
            debugInfo.classList.remove('show');

            if (!file.name.toLowerCase().endsWith('.zip')) {
                showStatus('⚠️ Please upload a ZIP file', 'error');
                debugLog('ERROR: Not a ZIP file');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showStatus('⚠️ File size exceeds 50MB limit', 'error');
                debugLog('ERROR: File too large');
                return;
            }

            fileName.textContent = '📦 ' + file.name;
            fileSize.textContent = `Size: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
            fileInfo.classList.add('show');
            downloadBtn.classList.remove('show');
            convertMoreBtn.classList.remove('show');

            showStatus('⚡ Processing ZIP file...', 'processing');
            progressBar.classList.add('show');
            updateProgress(10);

            try {
                debugLog('Loading ZIP file...');
                const zip = await JSZip.loadAsync(file);
                debugLog('ZIP loaded successfully');
                debugLog('Files in ZIP: ' + Object.keys(zip.files).length);

                Object.keys(zip.files).forEach(name => {
                    debugLog('  - ' + name);
                });

                const csvFiles = Object.keys(zip.files).filter(name => {
                    const f = zip.files[name];
                    return !f.dir &&
                           name.toLowerCase().endsWith('.csv') &&
                           !name.includes('__MACOSX') &&
                           !name.includes('/.') &&
                           !name.startsWith('.');
                });

                const excelFiles = Object.keys(zip.files).filter(name => {
                    const f = zip.files[name];
                    const lowerName = name.toLowerCase();
                    return !f.dir &&
                           (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls') || lowerName.endsWith('.xlsm')) &&
                           !name.includes('__MACOSX') &&
                           !name.includes('/.') &&
                           !name.startsWith('.');
                });

                debugLog('CSV files found: ' + csvFiles.length);
                csvFiles.forEach(f => debugLog('  CSV: ' + f));

                debugLog('Excel files found: ' + excelFiles.length);
                excelFiles.forEach(f => debugLog('  Excel: ' + f));

                const totalFiles = csvFiles.length + excelFiles.length;

                if (totalFiles === 0) {
                    showStatus('❌ No CSV or Excel files found in ZIP', 'error');
                    progressBar.classList.remove('show');
                    debugLog('ERROR: No valid files found');
                    return;
                }

                fileCount.textContent = `✓ Found ${csvFiles.length} CSV and ${excelFiles.length} Excel file(s)`;
                updateProgress(20);

                workbook = XLSX.utils.book_new();
                const usedSheetNames = new Set();
                let totalSheets = 0;
                let processed = 0;

                // Process CSV files
                debugLog('Processing CSV files...');
                for (const csvFile of csvFiles) {
                    debugLog('Processing CSV: ' + csvFile);
                    const content = await zip.files[csvFile].async('string');
                    debugLog('CSV content length: ' + content.length);

                    const parsed = Papa.parse(content, {
                        header: true,
                        skipEmptyLines: true,
                        dynamicTyping: true
                    });

                    debugLog('Parsed rows: ' + parsed.data.length);

                    if (parsed.data.length > 0) {
                        const filteredData = extractFirst11Columns(parsed.data);

                        const baseName = csvFile.split('/').pop().replace('.csv', '');
                        const sheetName = generateUniqueSheetName(baseName, usedSheetNames);
                        debugLog('Creating sheet: ' + sheetName);

                        const worksheet = XLSX.utils.json_to_sheet(filteredData);
                        XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
                        totalSheets++;
                    }

                    processed++;
                    updateProgress(20 + (processed / totalFiles) * 40);
                }

                // Process Excel files
                debugLog('Processing Excel files...');
                for (const excelFile of excelFiles) {
                    debugLog('Processing Excel: ' + excelFile);
                    const content = await zip.files[excelFile].async('arraybuffer');
                    debugLog('Excel file size: ' + content.byteLength);

                    const excelWorkbook = XLSX.read(content, { type: 'array' });
                    debugLog('Excel sheets: ' + excelWorkbook.SheetNames.length);

                    const baseFileName = excelFile.split('/').pop().replace(/\.(xlsx|xls|xlsm)$/i, '');

                    for (const sheetName of excelWorkbook.SheetNames) {
                        debugLog('Processing sheet: ' + sheetName);
                        const worksheet = excelWorkbook.Sheets[sheetName];
                        const data = XLSX.utils.sheet_to_json(worksheet);

                        debugLog('Sheet rows: ' + data.length);

                        if (data.length > 0) {
                            const filteredData = extractFirst11Columns(data);

                            const combinedName = `${baseFileName}_${sheetName}`;
                            const uniqueSheetName = generateUniqueSheetName(combinedName, usedSheetNames);
                            debugLog('Creating sheet: ' + uniqueSheetName);

                            const newWorksheet = XLSX.utils.json_to_sheet(filteredData);
                            XLSX.utils.book_append_sheet(workbook, newWorksheet, uniqueSheetName);
                            totalSheets++;
                        }
                    }

                    processed++;
                    updateProgress(20 + (processed / totalFiles) * 40);
                }

                updateProgress(100);
                sheetCount.textContent = `📊 Created ${totalSheets} sheet(s) with first 11 columns`;
                showStatus(`🎉 Successfully merged ${totalFiles} file(s) into ${totalSheets} sheet(s)!`, 'success');
                downloadBtn.classList.add('show');
                convertMoreBtn.classList.add('show');
                debugLog('Processing complete!');

            } catch (error) {
                console.error('Error details:', error);
                debugLog('ERROR: ' + error.message);
                debugLog('Stack: ' + error.stack);
                showStatus('❌ Error processing ZIP file: ' + error.message, 'error');
                progressBar.classList.remove('show');
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (workbook) {
                debugLog('Downloading workbook...');
                XLSX.writeFile(workbook, 'merged_output.xlsx');
                showStatus('✅ Excel file downloaded successfully!', 'success');

                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createSparkle(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight
                        );
                    }, i * 100);
                }
            }
        });

        convertMoreBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInfo.classList.remove('show');
            status.classList.remove('show');
            downloadBtn.classList.remove('show');
            convertMoreBtn.classList.remove('show');
            progressBar.classList.remove('show');
            progressFill.style.width = '0%';
            debugInfo.classList.remove('show');
            debugInfo.textContent = '';
            workbook = null;
            fileName.textContent = '';
            fileSize.textContent = '';
            fileCount.textContent = '';
            sheetCount.textContent = '';
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show ' + type;
        }

        function updateProgress(percent) {
            progressFill.style.width = percent + '%';
        }

        window.addEventListener('load', () => {
            debugLog('Page loaded');
            debugLog('JSZip available: ' + (typeof JSZip !== 'undefined'));
            debugLog('XLSX available: ' + (typeof XLSX !== 'undefined'));
            debugLog('Papa available: ' + (typeof Papa !== 'undefined'));
        });
    </script>
</body>
</html>
